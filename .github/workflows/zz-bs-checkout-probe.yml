# FORK-ONLY measurement harness: useblacksmith/checkout vs the Git seed on a
# target 1155 upstream commits ahead of both caches.
name: zz-bs-checkout-probe
on:
  push:
    branches: [bs-checkout-probe]
permissions:
  contents: read
jobs:
  stale-mirror:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Blacksmith checkout
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1
        with:
          ref: probe-upstream-tip
          fetch-depth: 2
      - run: git log --oneline -1; du -sh .git
  after-refresh:
    needs: stale-mirror
    strategy:
      matrix:
        i: [1, 2, 3]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Blacksmith checkout
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1
        with:
          ref: probe-upstream-tip
          fetch-depth: 2
      - run: git log --oneline -1
  stale-seed:
    strategy:
      matrix:
        i: [1, 2, 3]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Restore Git object seed
        id: seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-git-seed
          key: openclaw-git-seed-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: openclaw-git-seed-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Seeded checkout
        run: |
          set -euo pipefail
          seed="$RUNNER_TEMP/openclaw-git-seed"
          echo "seed key: ${{ steps.seed.outputs.cache-matched-key }} commit $(cat "$seed/commit")"
          git init -q "$GITHUB_WORKSPACE/ws"; cd "$GITHUB_WORKSPACE/ws"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          for f in "$seed"/pack/pack-*.pack "$seed"/pack/pack-*.rev "$seed"/pack/pack-*.idx; do [ -e "$f" ] && mv "$f" .git/objects/pack/; done
          commit=$(cat "$seed/commit"); echo "$commit" >> .git/shallow; git update-ref refs/ci-seed "$commit"
          s=$(date +%s.%N)
          git -c protocol.version=2 fetch -q --no-tags --no-recurse-submodules --depth=2 origin +refs/heads/probe-upstream-tip:refs/remotes/origin/checkout
          f=$(date +%s.%N)
          git update-ref -d refs/ci-seed; git checkout -q --detach refs/remotes/origin/checkout
          c=$(date +%s.%N)
          printf 'fetch=%.1fs checkout=%.1fs\n' "$(echo "$f-$s"|bc)" "$(echo "$c-$f"|bc)"
