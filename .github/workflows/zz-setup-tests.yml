name: zz setup tests

on:
  push:
    branches: ["exp/setup/tests*"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        ref: [732464953791b16edbe9e7f322985dd36d2ecb56, change]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref == 'change' && github.sha || matrix.ref }}
      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          dependency-cache: "true"
          install-bun: "false"
      - name: Generated owner projection
        continue-on-error: true
        run: node scripts/generate-ci-git-owner.mts --check
      - name: Workflow and owner tests
        run: |
          files=$(ls test/scripts/ci-git-owner*.test.ts test/scripts/ci-workflow-*.test.ts test/scripts/ci-warm-vitest-caches.test.ts | tr '\n' ' ')
          pnpm test $files > /tmp/test.log 2>&1 && echo rc=0 || echo "rc=$?"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E "Test Files|Tests  " | sort -u
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E "^ *(FAIL|×) " | sed -E 's/ [0-9]+ms$//; s/^ *× / FAIL /' | sort -u | sed 's/^/FAILED-TEST /'
