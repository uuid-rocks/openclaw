name: zz-lint-exp
on:
  push:
    branches: ["exp/lint/**"]
permissions:
  contents: read
concurrency:
  group: zz-lint-exp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exp:
    name: ${{ matrix.v }} r${{ matrix.rep }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        v:
          - row-cur-a
          - row-cur-b
          - row-new-a
          - row-new-b
          - ext-h-t1
          - ext-h-t2
        include:
          - { v: row-cur-a, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { v: row-cur-b, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { v: row-new-a, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { v: row-new-b, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { v: ext-h-t1, runner: ubuntu-24.04 }
          - { v: ext-h-t2, runner: ubuntu-24.04 }
    env:
      OPENCLAW_LOCAL_CHECK: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: false
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "true"
      - name: Experiment
        shell: bash
        env:
          V: ${{ matrix.v }}
        run: |
          set -euo pipefail
          echo "nproc=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G"
          peak=0
          ( while true; do awk '/MemTotal/{t=$2}/MemAvailable/{a=$2}END{print (t-a)/1048576}' /proc/meminfo >> /tmp/mem.txt; sleep 2; done ) &
          sampler=$!
          t() { local s=$(date +%s) rc=0; echo "::group::$*"; TIMEFORMAT="[time] %R s wall, %U user, %S sys"; time "$@" || rc=$?; echo "::endgroup::"; echo "[step] $(( $(date +%s) - s ))s rc=$rc :: $*" >&2; }
          lint() { node --import tsx scripts/run-oxlint-shards.mts "$@"; }
          types() { node scripts/run-tsgo-core-test-shards.mjs "$@"; }
          all_stripes=(--core-stripe=1/5 --core-stripe=2/5 --core-stripe=3/5 --core-stripe=4/5 --core-stripe=5/5)
          node --import tsx --input-type=module -e '
            import os from "node:os";
            import { applyLocalOxlintPolicy, applyLocalTsgoPolicy } from "./scripts/lib/local-check-runtime.mts";
            import { readProcessMemoryCapacity } from "./scripts/lib/process-memory.mts";
            const m = readProcessMemoryCapacity({});
            const r = { logicalCpuCount: os.availableParallelism(), totalMemoryBytes: os.totalmem(), memoryCapacityBytes: m.capacityBytes, memoryLimitBytes: m.usageKnown && m.availableBytes !== null ? m.limitBytes : null, platform: process.platform };
            console.log("[policy] resources", JSON.stringify(r));
            const env = { ...process.env, CI: "true", GITHUB_ACTIONS: "true", OPENCLAW_LOCAL_CHECK: "0", OPENCLAW_OXLINT_BATCH_CONCURRENCY: "1" };
            const a = ["--tsconfig", "config/tsconfig/oxlint.core.json", "src/gateway", "--threads=1"];
            const o = applyLocalOxlintPolicy(a, { ...env, OPENCLAW_OXLINT_BOUNDED_SHARD_ARGS: JSON.stringify(a) }, r);
            console.log("[policy] oxlint", o.args.join(" "), o.env.GOMAXPROCS, o.env.GOGC, o.env.GOMEMLIMIT);
            const t = applyLocalTsgoPolicy(["-p", "x.json"], env, r);
            console.log("[policy] tsgo", t.args.join(" "), t.env.GOMAXPROCS);
          ' || true
          head_sha=$(git rev-parse HEAD)
          tc() { # $1=commit offset, $2=concurrency
            local base; base=$(git rev-parse "HEAD~$1")
            git checkout -q -f "$base"
            t types --stripe 1-5/5 --concurrency "$2"
            t types --root-stripe 1/1
            git checkout -q -f "$head_sha"
            t types --stripe 1-5/5 --concurrency "$2"
            t types --root-stripe 1/1
          }
          inject() { sed -i 's/export function shortenHomePath(input: string): string/export function shortenHomePath(input: string, _required: number): string/' src/utils.ts; git diff --stat; }
          start=$(date +%s)
          files='["src/gateway/active-sessions-shutdown-drain.ts","src/gateway/active-sessions-shutdown-tracker.ts","src/agents/accepted-session-spawn.ts","src/infra/abort-signal.ts","src/cli/account-selector-boundary.test.ts","ui/src/app/app-host.tsx","src/config/agent-dirs.fs-identity.test.ts"]'
          case "$V" in
            row-cur-a) for s in 1 2; do t lint --only=core --split-core --core-stripe="$s/5" --threads=1; done ;;
            row-cur-b) for s in 3 4 5; do t lint --only=core --split-core --core-stripe="$s/5" --threads=1; done ;;
            row-new-a) for s in 1 3 5; do t lint --only=core --split-core --core-stripe="$s/5" --threads=2; done ;;
            row-new-b) for s in 2 4; do t lint --only=core --split-core --core-stripe="$s/5" --threads=2; done ;;
            ext-h-t*)
              th="${V##*-t}"
              t lint --only=extensions --extension-stripe=1/3 --threads="$th" ;;
            lint-4-s45-t*)
              th="${V##*-t}"
              for s in 4 5; do t lint --only=core --split-core --core-stripe="$s/5" --threads="$th"; done ;;
            chg-*-serial)
              for s in 1 2 3 4 5; do t lint --only=core --split-core --core-stripe="$s/5" --files-json "$files" --threads=1; done ;;
            chg-*-multi)
              t lint --only=core --split-core "${all_stripes[@]}" --files-json "$files" --threads=1 ;;
            lint-4-gotune)
              for s in 1 2 3 4 5; do GOMAXPROCS=4 GOGC=100 GOMEMLIMIT=10GiB t lint --only=core --split-core --core-stripe="$s/5" --threads=1; done ;;
            tc-4-a20) tc 21 2 ;;
            tc-4-a40) tc 41 2 ;;
            tc-16-a20) tc 21 4 ;;
            tc-16-err)
              t types --stripe 1-5/5 --concurrency 4
              inject
              t types --stripe 1-5/5 --concurrency 4 2>&1 | grep -E "error TS|failed" | sort | tee /tmp/err-warm.txt
              echo "[errors] warm $(grep -c 'error TS' /tmp/err-warm.txt)" ;;
            tc-16-errcold)
              inject
              t types --stripe 1-5/5 --concurrency 4 2>&1 | grep -E "error TS|failed" | sort | tee /tmp/err-cold.txt
              echo "[errors] cold $(grep -c 'error TS' /tmp/err-cold.txt)" ;;
            types-*-all-c2)
              t types --stripe 1-5/5 --concurrency 2
              t types --root-stripe 1/1 ;;
            lint-*-serial)
              for s in 1 2 3 4 5; do t lint --only=core --split-core --core-stripe="$s/5" --threads=1; done ;;
            lint-*-multi)
              t lint --only=core --split-core "${all_stripes[@]}" --threads=1 ;;
            lint-*-multi-c9)
              OPENCLAW_OXLINT_SHARD_CONCURRENCY=9 t lint --only=core --split-core "${all_stripes[@]}" --threads=1 ;;
            lint-*-unsplit)
              t lint --only=core ;;
            types-*-stripe3-c4)
              t types --stripe 3/5 --concurrency 4
              t env OPENCLAW_LOCAL_CHECK=0 node scripts/run-tsgo-core-test-shards.mjs --root-stripe 2/4 ;;
            types-*-2stripes-c4)
              t types --stripe 3-4/5 --concurrency 4
              t types --root-stripe 2/4
              t types --root-stripe 3/4 ;;
            types-*-stripe3)
              t types --stripe 3/5 --concurrency 2
              t env OPENCLAW_LOCAL_CHECK=0 node scripts/run-tsgo-core-test-shards.mjs --root-stripe 2/4 ;;
            types-*-all-c4)
              t types --stripe 1-5/5 --concurrency 4
              t types --root-stripe 1/1 ;;
            types-*-all-c8)
              t types --stripe 1-5/5 --concurrency 8
              OPENCLAW_EXP_ROOT_OVERLAP=1 t types --root-stripe 1/1 --concurrency 4 ;;
            types-*-all-c16)
              t types --stripe 1-5/5 --concurrency 16
              OPENCLAW_EXP_ROOT_OVERLAP=1 t types --root-stripe 1/1 --concurrency 4 ;;
            types-*-incr)
              t types --stripe 3/5 --concurrency 2
              ls -la .artifacts/tsgo-cache 2>/dev/null || true
              find . -name '*.tsbuildinfo' -newer package.json -not -path './node_modules/*' 2>/dev/null | head -20
              t types --stripe 3/5 --concurrency 2 ;;
          esac
          kill $sampler || true
          echo "[total] $(( $(date +%s) - start ))s"
          echo "[mem] peak used $(sort -n /tmp/mem.txt | tail -1) GiB"
