name: zz-types-test
on:
  push:
    branches: ["exp/lint/types-*-test"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      OPENCLAW_LOCAL_CHECK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: restore
          install-bun: "false"
          dependency-cache: "true"
      - name: Format touched files
        if: always()
        run: |
          node scripts/run-format.mts --write scripts/ci-check-plan.mts scripts/ci-build-manifest.mjs test/scripts/ci-check-plan.test.ts test/scripts/ci-workflow-planning.test.ts .github/workflows/ci.yml docs/ci.md .agents/skills/openclaw-ci-limits/SKILL.md docs/ci/capacity.md || true
          git diff
      - name: Types
        if: always()
        run: |
          node scripts/run-tsgo-core-test-shards.mjs --root-stripe 1/4
          pnpm tsgo:scripts
      - name: Touched tests
        if: always()
        run: node scripts/test-projects.mts test/scripts/ci-check-plan.test.ts test/scripts/ci-workflow-planning.test.ts test/scripts/ci-workflow-guards.test.ts test/scripts/ci-workflow-complete.test.ts test/scripts/ci-known-main-red.test.ts test/scripts/setup-node-env-semantic-memory.test.ts test/scripts/tsgo-core-test-shards.test.ts test/scripts/ci-changed-lint.test.ts
