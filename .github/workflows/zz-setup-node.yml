name: zz setup node probe

on:
  push:
    branches: ["exp/setup/node*"]

permissions:
  contents: read

jobs:
  node:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        sample: [1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          dependency-cache: "true"
          install-bun: "false"
          vitest-fs-cache: "true"
          node-compile-cache: "true"

      - name: Inventory and prune
        env:
          CI: "true"
        run: |
          set -uo pipefail
          export PATH="$NODE_BIN:$PATH"
          store=.cache/openclaw-pnpm-store
          sizes() {
            du -sh node_modules "$store" "$store"/* 2>/dev/null | tr '\n' ' '; echo
            find "$store" -type f -links 1 -printf '%s\n' | awk '{s+=$1} END {printf "store links=1: %.1f MiB in %d files\n", s/1048576, NR}'
            find node_modules -type f -links 1 -printf '%s\n' | awk '{s+=$1} END {printf "node_modules links=1: %.1f MiB in %d files\n", s/1048576, NR}'
          }
          archive() {
            paths=(node_modules ui/node_modules packages/*/node_modules extensions/*/node_modules examples/*/node_modules "$store")
            existing=(); for p in "${paths[@]}"; do [ -e "$p" ] && existing+=("$p"); done
            tar -cf - -P "${existing[@]}" | zstd -T0 -3 --long=30 -q -o /tmp/deps-$1.tzst
            ls -la /tmp/deps-$1.tzst
          }
          echo "== before prune"; sizes
          echo "largest node_modules copies (links=1):"
          find node_modules -type f -links 1 -size +2M -printf '%s %p\n' | sort -n | tail -15 | awk '{printf "%8.1f MiB %s\n", $1/1048576, $2}'
          echo "largest store links=1:"
          find "$store" -type f -links 1 -size +2M -printf '%s %p\n' | sort -n | tail -15 | awk '{printf "%8.1f MiB %s\n", $1/1048576, $2}'
          ls "$store"/v11 2>/dev/null
          du -sh "$store"/v11/* 2>/dev/null
          archive before
          t0=$(date +%s.%N)
          pnpm store prune 2>&1 | tail -5
          echo "prune took $(echo "$(date +%s.%N)-$t0" | bc)s"
          echo "== after prune"; sizes
          archive after
          t0=$(date +%s.%N)
          DEPENDENCY_CACHE=true DEPENDENCY_CACHE_HIT=true FROZEN_LOCKFILE=true bash .github/actions/setup-node-env/install-dependencies.sh 2>&1 | tail -4
          echo "rc=${PIPESTATUS[0]} reconcile after prune $(echo "$(date +%s.%N)-$t0" | bc)s"
          rm -rf node_modules
          find ui packages extensions examples -mindepth 1 -maxdepth 2 \( -type d -o -type l \) -name node_modules -exec rm -rf -- {} +
          t0=$(date +%s.%N)
          DEPENDENCY_CACHE=true DEPENDENCY_CACHE_HIT=true FROZEN_LOCKFILE=true bash .github/actions/setup-node-env/install-dependencies.sh 2>&1 | tail -6
          echo "rc=${PIPESTATUS[0]} relink from pruned store $(echo "$(date +%s.%N)-$t0" | bc)s"
      - name: done
        run: echo ok
