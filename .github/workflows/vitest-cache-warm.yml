name: Vitest Cache Warm

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
  repository_dispatch:
    types: [vitest-cache-warm]
  schedule:
    - cron: "17 * * * *"

# Match npm preflight and FRV only for full-build cache publication.
env:
  RELEASE_BUILD_NODE_VERSION: "24.22.1"

permissions:
  contents: read

jobs:
  dependencies:
    # Shared CI cache publication is isolated from pull-request execution.
    # Trusted release/proof workflows may save only through the same authority contract.
    if: ${{ github.repository == 'uuid-rocks/openclaw' && github.ref == 'refs/heads/main' && (github.event_name != 'push' || vars.OPENCLAW_CI_ON_PUSH == 'true') }}
    runs-on: ${{ matrix.platform == 'macos' && 'xcode-27' || ((matrix.platform == 'linux-hosted' || vars.OPENCLAW_CI_RUNNER_BACKEND == 'github') && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404') }}
    timeout-minutes: 20
    concurrency:
      group: ${{ format('vitest-cache-warm-dependencies-{0}-{1}', matrix.platform == 'linux' && vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' && 'linux-hosted' || matrix.platform, format('{0}-{1}', github.event_name, github.ref)) }}
      cancel-in-progress: false
    strategy:
      # Each platform publishes its own cache namespace independently.
      fail-fast: false
      matrix:
        # Hybrid's hosted lanes cannot read Blacksmith's backend-local cache.
        # Dependency publication must not queue behind long code warming.
        platform: ${{ fromJSON(vars.OPENCLAW_CI_RUNNER_BACKEND == 'hybrid' && '["linux", "linux-hosted", "macos"]' || '["linux", "macos"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node environment
        id: setup-node-env
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: read-write
          dependency-cache: ${{ matrix.platform == 'linux' && 'true' || 'false' }}
          install-bun: "false"

      # ci.yml's Git owner adopts this shallow pack before fetching a target.
      # One entry per UTC day bounds cache growth; a day-old seed still fetches in ~6s.
      - name: Resolve Git object seed key
        id: git-seed
        if: runner.os == 'Linux' && steps.setup-node-env.outputs.cache-mode == 'read-write'
        run: echo "key=openclaw-git-seed-v1-${RUNNER_OS}-${RUNNER_ARCH}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Check Git object seed
        id: git-seed-lookup
        if: runner.os == 'Linux' && steps.setup-node-env.outputs.cache-mode == 'read-write'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-git-seed
          key: ${{ steps.git-seed.outputs.key }}
          lookup-only: true

      - name: Pack Git object seed
        if: runner.os == 'Linux' && steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.git-seed-lookup.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          seed="$RUNNER_TEMP/openclaw-git-seed"
          rm -rf "$seed"
          mkdir -p "$seed/pack"
          cp .git/objects/pack/pack-* "$seed/pack/"
          git rev-parse HEAD > "$seed/commit"

      - name: Save Git object seed
        if: runner.os == 'Linux' && steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.git-seed-lookup.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openclaw-git-seed
          key: ${{ steps.git-seed.outputs.key }}

      # Setup owns the completed toolchain and dependency trees. Publish them
      # before build and transform warming delay unrelated readers.
      - name: Save Node toolchain cache
        if: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' && runner.os != 'Windows' && runner.environment != 'github-hosted' && steps.setup-node-env.outputs.node-toolchain-populated == 'true' && steps.setup-node-env.outputs.node-toolchain-cache-matched-key != steps.setup-node-env.outputs.node-toolchain-cache-key }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-node-env.outputs.node-toolchain-cache-path }}
          key: ${{ steps.setup-node-env.outputs.node-toolchain-cache-key }}

      - name: Save exact dependency cache
        if: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.setup-node-env.outputs.dependency-cache-key != '' && steps.setup-node-env.outputs.dependency-cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ui/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            examples/*/node_modules
            .cache/openclaw-pnpm-store
          key: ${{ steps.setup-node-env.outputs.dependency-cache-key }}

      - name: Save pnpm store cache
        if: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.setup-node-env.outputs.pnpm-store-cache-key != '' && steps.setup-node-env.outputs.pnpm-store-cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-node-env.outputs.pnpm-store-cache-path }}
          key: ${{ steps.setup-node-env.outputs.pnpm-store-cache-key }}

      - name: Warm Playwright Chromium
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: read-write

  warm:
    if: ${{ github.repository == 'uuid-rocks/openclaw' && github.ref == 'refs/heads/main' && (github.event_name != 'push' || vars.OPENCLAW_CI_ON_PUSH == 'true') }}
    runs-on: ${{ (matrix.platform == 'linux-hosted' || vars.OPENCLAW_CI_RUNNER_BACKEND == 'github') && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    concurrency:
      group: ${{ format('vitest-cache-warm-code-{0}-{1}', matrix.platform == 'linux' && vars.OPENCLAW_CI_RUNNER_BACKEND == 'github' && 'linux-hosted' || matrix.platform, format('{0}-{1}', github.event_name, github.ref)) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(vars.OPENCLAW_CI_RUNNER_BACKEND == 'hybrid' && '["linux", "linux-hosted"]' || '["linux"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Independent setup consumes the latest completed dependency seed. This
      # job never publishes dependencies, even if their short publisher is busy.
      - name: Setup Node environment
        id: setup-node-env
        uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          cache-mode: read-write
          dependency-cache: ${{ matrix.platform == 'linux' && 'true' || 'false' }}
          install-bun: "false"
          node-compile-cache: "true"
          vitest-fs-cache: "true"
          vitest-worker-cache: ${{ matrix.platform == 'linux' && 'true' || 'false' }}

      - name: Remember test Node runtime
        id: test-node
        if: ${{ matrix.platform == 'linux' }}
        run: echo "version=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

      - name: Setup pinned Bun test runtime
        uses: ./.github/actions/setup-test-bun

      # Match source-only shards before SDK/runtime builds change resolution topology.
      - name: Prepare compiled Vitest workers
        if: ${{ matrix.platform == 'linux' }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_VITEST_WORKER_CACHE: "1"
        run: node scripts/prepare-vitest-worker-cache.mts

      - name: Save compiled Vitest workers
        if: ${{ matrix.platform == 'linux' && steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.setup-node-env.outputs.vitest-worker-cache-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/vitest-worker-cache
          key: ${{ steps.setup-node-env.outputs.vitest-worker-cache-key }}

      # Hosted Linux SDK publication belongs to CI lint stripe 1. Other owners seal
      # before the full build changes resolution topology outside this payload.
      - name: Restore native SDK boundary cache
        id: extension-package-boundary-cache
        if: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' && (matrix.platform == 'macos' || runner.environment != 'github-hosted') }}
        uses: ./.github/actions/sdk-declarations
        with:
          mode: restore-main
          cache-mode: ${{ steps.setup-node-env.outputs.cache-mode }}

      - name: Prepare native SDK boundary cache
        if: ${{ matrix.platform == 'macos' || runner.environment != 'github-hosted' }}
        run: node --import ./scripts/tsx.mjs scripts/prepare-extension-package-boundary-artifacts.mts --mode=package-boundary

      - name: Save native SDK boundary cache
        if: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' && (matrix.platform == 'macos' || runner.environment != 'github-hosted') && steps.extension-package-boundary-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/sdk-declarations
        with:
          mode: save-main
          candidate-trust: main
          cache-mode: ${{ steps.setup-node-env.outputs.cache-mode }}
          cache-write-allowed: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' }}
          cache-hit: ${{ steps.extension-package-boundary-cache.outputs.cache-hit }}

      # Release consumers pin Node exactly; the ordinary 24.x test runtime may
      # resolve an older image version. Switch only this existing build segment.
      - name: Setup release build runtime and cache
        id: release-build-env
        if: ${{ matrix.platform == 'linux' }}
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.RELEASE_BUILD_NODE_VERSION }}
          install-deps: "false"
          install-bun: "false"
          cache-mode: read-write
          build-all-cache-scope: full

      # Packaged declarations must see the same tree as ordinary build consumers.
      # The native lint output belongs only in its completed cache archive.
      - name: Clear native SDK boundary output before build
        if: ${{ matrix.platform == 'linux' }}
        run: rm -rf packages/plugin-sdk/dist

      - name: Warm build cache
        if: ${{ matrix.platform == 'linux' }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Save build-all cache
        if: ${{ steps.release-build-env.outputs.cache-mode == 'read-write' && steps.release-build-env.outputs.build-all-cache-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/build-all-cache
          key: ${{ steps.release-build-env.outputs.build-all-cache-key }}

      - name: Save dist build cache
        if: ${{ matrix.platform == 'linux' && steps.setup-node-env.outputs.cache-mode == 'read-write' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/
            dist-runtime/
            packages/*/dist/
            extensions/*/src/host/**/.bundle.hash
            extensions/*/src/host/**/*.bundle.js
          key: ${{ runner.os }}-dist-build-v3-${{ github.sha }}

      - name: Restore test Node runtime
        if: ${{ matrix.platform == 'linux' && steps.test-node.outputs.version != env.RELEASE_BUILD_NODE_VERSION }}
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ steps.test-node.outputs.version }}
          install-deps: "false"
          install-bun: "false"
          cache-mode: "off"

      - name: Warm transform and compile caches
        id: warm-caches
        continue-on-error: true
        shell: bash
        env:
          CACHE_WARM_PLATFORM: ${{ matrix.platform }}
          OPENCLAW_CI_TEST_RUNTIME_POLICY: ${{ github.event_name == 'workflow_dispatch' && 'dual-all' || 'bun-all' }}
          # Match the CI shard lanes running the same envelopes: without the
          # raised ceiling a heavy suite's worker can die under default heap
          # (run 31874567859), skipping every cache save for the day.
          NODE_OPTIONS: --max-old-space-size=8192
          # Only the publisher prunes restored entries before saving a new seed.
          OPENCLAW_VITEST_FS_MODULE_CACHE_WRITER: "1"
          OPENCLAW_NODE_COMPILE_CACHE_WRITER: "1"
        run: node --import tsx scripts/ci-warm-vitest-caches.mts

      # The Node collection already prepares and joins a full generation after
      # the build. Preserve the earlier source-only archive for ordinary shards.
      - name: Save built-source compiled Vitest workers
        if: ${{ matrix.platform == 'linux' && steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.warm-caches.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/vitest-worker-cache/run-cache-0
          key: ${{ github.repository }}-vitest-workers-built-v1-protected-${{ steps.setup-node-env.outputs.node-toolchain-cache-key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Vitest transform cache
        if: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.setup-node-env.outputs.vitest-cache-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/openclaw-vitest-fs-cache
          key: ${{ steps.setup-node-env.outputs.vitest-cache-key }}

      - name: Save Node compile cache
        if: ${{ steps.setup-node-env.outputs.cache-mode == 'read-write' && steps.setup-node-env.outputs.node-compile-cache-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/openclaw-node-compile-cache
          key: ${{ steps.setup-node-env.outputs.node-compile-cache-key }}

      - name: Assert cache warming succeeded
        if: ${{ always() }}
        run: |
          if [ "${{ steps.warm-caches.outcome }}" != "success" ]; then
            echo "::error::Vitest cache warming failed"
            exit 1
          fi
