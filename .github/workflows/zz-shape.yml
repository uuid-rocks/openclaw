name: zz-shape
on:
  push:
    branches: ["probe/shape"]
jobs:
  probe:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          emu_mem=16535624089
          kib=$((emu_mem / 1024))
          awk -v t="$kib" '
            /^MemTotal:/ {printf "MemTotal:       %d kB\n", t; next}
            /^MemFree:/ || /^MemAvailable:/ {printf "%-16s%d kB\n", $1, t*9/10; next}
            {print}' /proc/meminfo > "$RUNNER_TEMP/meminfo"
          sudo mount --bind "$RUNNER_TEMP/meminfo" /proc/meminfo
          head -3 /proc/meminfo
      - run: |
          free -g | head -2; node -p 'require("os").totalmem()/2**30'; python3 -c "import os; print(os.sysconf('SC_PHYS_PAGES')*os.sysconf('SC_PAGE_SIZE')/2**30)"
          go version 2>/dev/null || true
