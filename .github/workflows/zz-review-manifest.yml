name: zz-review-manifest
on:
  push:
    branches: ["exp/review/manifest-warm"]
permissions:
  contents: read
jobs:
  cpus:
    strategy:
      fail-fast: false
      matrix:
        cpus: ["0-1", "0-3", "0-7"]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Bench manifest by CPU count
        run: taskset -c "${{ matrix.cpus }}" bash .github/zz-review/bench-cpus.sh 3
