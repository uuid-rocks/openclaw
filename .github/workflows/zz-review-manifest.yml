name: zz-review-manifest
on:
  push:
    branches: ["exp/review/manifest-warm"]
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Bench manifest warm vs nowarm
        run: |
          if [[ "$RUNNER_NAME" == blacksmith-* ]]; then
            # emulate upstream 4vcpu shape (2 CPUs)
            exec taskset -c 0,1 bash .github/zz-review/bench.sh 3
          fi
          bash .github/zz-review/bench.sh 3
